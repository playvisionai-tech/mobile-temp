# 🔗 Links:
# Source file: https://github.com/obytes/react-native-template-obytes/blob/master/.github/workflows/type-check.yml

# ✍️ Description:
# This action is used to run the type-check on the project.
# Runs on pull requests and pushes to  the main/master branches
# Based on the event type:
#   - If it's a pull request, it will run type checking, then add the check to the PR as well as annotate the code with the errors using reviewdog.
#   - If it's a push to main/master, it will run the type checking and fail if there are any errors.

# 🚨 GITHUB SECRETS REQUIRED: NONE

name: Type Check (tsc)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  type-check:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      # `.expo/types/router.d.ts` is generated by the dev server and gitignored
      # (`.gitignore` line 2, `.expo/`), so a fresh CI checkout has no route
      # types at all. Without it `Href` falls back to its permissive default and
      # tsc silently stops checking EVERY route path in the app — a wrong
      # `<Link href="...">` would pass CI. Generate it here so CI checks what a
      # developer's machine checks. See src/lib/navigation/decisions.md.
      - name: 🧭 Generate expo-router route types
        env:
          EXPO_ROUTER_APP_ROOT: ${{ github.workspace }}/src/app
        run: |
          mkdir -p .expo/types
          node -e "
            const fs = require('node:fs');
            const out = process.cwd() + '/.expo/types';
            const file = out + '/router.d.ts';
            require('expo-router/build/typed-routes').regenerateDeclarations(out);
            // regenerateDeclarations is debounced by 1s, so poll for the file
            // rather than guessing a sleep. Failing here is the point: a silent
            // no-op would let tsc pass while checking nothing.
            const deadline = Date.now() + 30000;
            (function poll() {
              if (fs.existsSync(file)) return console.log('Generated ' + file);
              if (Date.now() > deadline) {
                console.error('expo-router typegen produced no router.d.ts.');
                console.error('tsc would silently stop checking route paths, so this is fatal.');
                console.error('Entry point is internal to expo-router; check it still exists after an SDK bump.');
                process.exit(1);
              }
              setTimeout(poll, 100);
            })();
          "

      - name: 📦 Install Reviewdog
        if: github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1

      - name: 🏃‍♂️ Run TypeScript PR # Reviewdog tsc errorformat: %f:%l:%c - error TS%n: %m
        # We only need to add the reviewdog step if it's a pull request
        if: github.event_name == 'pull_request'
        run: |
          pnpm type-check | reviewdog -name="tsc" -efm="%f(%l,%c): error TS%n: %m" -reporter="github-pr-review" -filter-mode="nofilter" -fail-on-error -tee
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name:
          🏃‍♂️ Run TypeScript Commit
          # If it's not a Pull Request then we just need to run the type-check
        if: github.event_name != 'pull_request'
        run: pnpm type-check
